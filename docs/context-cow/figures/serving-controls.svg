  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #a34a28" transform="translate(630.72 220.448516)">TOKEN PARITY: OPEN</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #a34a28" transform="translate(630.72 235.98)">Repeated A diverged in</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #a34a28" transform="translate(630.72 252.48)">every serving control.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #a34a28" transform="translate(630.72 268.98)">Timing is not evidence</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #a34a28" transform="translate(630.72 285.48)">of exact serving parity.</text>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334b" x="56.16" y="29.176406" transform="rotate(-0 56.16 29.176406)">Ordinary serving is fast; parity is still open.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657785" x="56.16" y="53.82" transform="rotate(-0 56.16 53.82)">Separate uncached native serving controls, A / B / A. Same 8K + 512 fixture; 128 outputs in every request.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #657785" transform="translate(56.16 441.030551)">Serving controls use different dispatch behavior and publication boundaries from the branching probe.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #657785" transform="translate(56.16 451.833012)">Do not attribute this entire gap to COW. Raw token traces, fixed-dispatch failures and source revisions are retained.</text>
  </g>
